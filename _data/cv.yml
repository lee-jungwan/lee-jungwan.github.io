    Experience:
      - company: Semiconductor System Lab (SSL), KAIST
        position: Graduate Researcher
        location: Daejeon, Korea
        start_date: 2025-09
        end_date: present
        highlights:
          - Developed low-bit weight and KV-cache compression techniques for efficient LLM inference using quantization and SVD-based compression.
          - Designed VectorFLASH, a long-context LLM accelerator with dual vector quantization, achieving 2.8–8.7 tokens/s on an edge FPGA.
          - Evaluated quantized LLMs across accuracy, memory footprint, latency, and throughput under resource-constrained hardware settings.
          - Developed on-device agentic LLM prototypes targeting efficient inference on tablet-class edge devices.

      - company: Semiconductor System Lab (SSL), KAIST
        position: Undergraduate Research Assistant
        location: Daejeon, Korea
        start_date: 2024-02
        end_date: 2024-12
        highlights:
          - Developed and optimized an on-device demo of C-Transformer on Samsung Galaxy S24.
          - Implemented clustering-based low-bit weight grouping, achieving 67.4% binary and 62.3% ternary sparsity.
          - Designed computation reordering to reduce bit transitions by 59.1%, resulting in 21.3% lower power consumption.
          - Co-authored Slim-Llama, presented at ISSCC 2025 and Hot Chips 2025.

